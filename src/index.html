<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Crew Signals → 구글 시트</title>
<style>
body{font:14px system-ui,sans-serif;margin:20px;color:#222}
h2{margin:0 0 14px} label{display:block;margin:10px 0 4px;font-weight:600}
input[type=text],input[type=number]{width:100%;padding:8px;box-sizing:border-box}
.row{display:flex;gap:8px}.row>*{flex:1}.row button{flex:0 0 auto}
button{padding:9px 16px;cursor:pointer}.primary{background:#2563eb;color:#fff;border:0;border-radius:6px}
#log{margin-top:14px;height:300px;overflow:auto;background:#111;color:#cfe;padding:10px;font:12px ui-monospace,monospace;white-space:pre-wrap;border-radius:6px}
progress{width:100%;margin-top:10px}.hint{color:#666;font-size:12px}
</style></head><body>
<h2>Crew Signals → 구글 시트 동기화</h2>
<label>구글 시트 주소</label><input id="sheet" type="text" placeholder="https://docs.google.com/spreadsheets/d/…">
<label>서비스 계정 키(JSON)</label>
<div class="row"><input id="key" type="text" readonly><button id="pick">파일 선택</button></div>
<div class="hint">시트를 이 JSON 안의 client_email 주소에 '편집자'로 공유해야 합니다.</div>
<div class="row"><div><label>탭 이름</label><input id="tab" type="text" value="아이디어"></div>
<div><label>이번에 처리할 최대 편수 (0=전부)</label><input id="limit" type="number" value="0" min="0"></div></div>
<label><input id="dry" type="checkbox"> 시험 실행 (시트에 쓰지 않음)</label>
<div class="row" style="margin-top:12px"><button id="go" class="primary">동기화 시작</button><button id="stop">중지</button></div>
<progress id="p" value="0" max="1"></progress><div id="log"></div>
<script src="renderer.js"></script></body></html>
